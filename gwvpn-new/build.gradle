// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.2.21"
    ext.hilt_version = '2.56.2'
    repositories {
        maven {url 'https://jitpack.io'}
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.5.3'
        classpath 'com.google.gms:google-services:4.4.1'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url('https://jitpack.io') }

        // CAS.AI mediated ad network repositories. Each is group-filtered so it is only
        // queried for its own artifacts and does not slow down other dependency lookups.
        maven {
            name = 'MintegralAdsRepo'
            url = 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea'
            content { includeGroup 'com.mbridge.msdk.oversea' }
        }
        maven {
            name = 'PangleAdsRepo'
            url = 'https://artifact.bytedance.com/repository/pangle'
            content { includeGroup 'com.pangle.global' }
        }
        maven {
            name = 'ChartboostAdsRepo'
            url = 'https://cboost.jfrog.io/artifactory/chartboost-ads/'
            content {
                includeGroup 'com.chartboost'
                includeGroup 'com.iab.omid.library'
            }
        }
        maven {
            name = 'YSONetworkRepo'
            url = 'https://ysonetwork.s3.eu-west-3.amazonaws.com/sdk/android'
            content { includeGroup 'com.ysocorp' }
        }
        maven {
            name = 'OguryAdsRepo'
            url = 'https://maven.ogury.co'
            content {
                includeGroup 'co.ogury'
                includeGroup 'co.ogury.module'
            }
        }
        maven {
            name = 'SmaatoAdsRepo'
            url = 'https://s3.amazonaws.com/smaato-sdk-releases/'
            content {
                includeGroup 'com.smaato.android.sdk'
                includeGroup 'com.verve'
            }
        }
        maven {
            name = 'VerveAdsRepo'
            url = 'https://verve.jfrog.io/artifactory/verve-gradle-release'
            content {
                includeGroup 'net.pubnative'
                includeGroup 'com.verve'
                includeGroup 'com.smaato.android.sdk'
            }
        }
        maven {
            name = 'SuperAwesomeRepo'
            url = 'https://aa-sdk.s3-eu-west-1.amazonaws.com/android_repo/'
            content { includeGroup 'tv.superawesome.sdk.publisher' }
        }
        maven {
            name = 'DisplayIOAdsRepo'
            url = 'https://maven.display.io/'
            content { includeGroup 'com.brandio.ads' }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
