# Daemon JVM criteria (Gradle 8.13): демона Gradle всегда запускаем на JDK 21.
# Без этого Android Studio с новым встроенным JBR (Java 25+) ломает сборку:
# «Unsupported class file major version 69» — Gradle 8.13 умеет максимум Java 24.
# Gradle сам находит локальный JDK 21 (Adoptium) или скачает его через
# foojay-resolver (см. settings.gradle).
toolchainVersion=21
