name: Google Play Beta Release

on:
  push:
    branches: [ "beta-release" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'keystore/keystore.jks'
          encodedString: ${{ secrets.ANDROID_KEYSTORE }}
      - uses: actions/checkout@v3
      - name: set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: build prod
        run: ./gradlew app:bundleRelease

      - name: Sign aab
        run: jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -storepass ${{ secrets.SIGNING_PASSWORD }} -keypass ${{ secrets.SIGNING_PASSWORD }} -keystore /home/runner/work/_temp/keystore/keystore.jks app/build/outputs/bundle/release/*.aab ${{ secrets.SIGNING_KEY_ALIAS }}

      - name: Upload aab to google play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: app.greywebs.vpn
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: beta
          status: draft
          changesNotSentForReview: true
          inAppUpdatePriority: 5
          whatsNewDirectory: whatsNew
          #mappingFile: app/build/outputs/mapping/release/mapping.txt