// foojay-resolver: умеет докачивать JDK под criteria демона
// (gradle/gradle-daemon-jvm.properties), если подходящего JDK на машине нет.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

include ':app'
include ':vyom-tun-sdk'
include ':amneziawg-tunnel'
include ':gw-tunnel'
rootProject.name = "Strong VPN"
